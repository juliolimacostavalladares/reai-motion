on:
  push:
    branches:
      - main
  pull_request:
name: Install and Test

env:
  FORCE_COLOR: 1
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_NO_UPDATE_NOTIFIER: 1
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Linting + Formatting
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Install
        run: bun ci
        env:
          CI: true
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Perform stylecheck
        timeout-minutes: 10
        run: |
          bun run stylecheck
      - name: Lint AI Video Studio
        run: bun run lint --filter='@remotion/ai-video-studio'
      - name: Test AI Video Studio
        run: bun run test --filter='@remotion/ai-video-studio'
      - name: Build AI Video Studio
        run: bun run build --filter='@remotion/ai-video-studio'
  build:
    name: Build Node ${{ matrix.node_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node_version: 16
          - os: windows-latest
            node_version: 16
          - os: macos-latest
            node_version: 25
    env:
      BUN_INSTALL_CACHE_DIR: ${{ matrix.os == 'windows-latest' && 'D:\.bun\install\cache' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: 1.3.3
      - name: Cache Bun dependencies (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v5
        with:
          path: D:\.bun\install\cache
          key: ${{ matrix.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ matrix.os }}-bun-
      - name: Install
        run: bun ci
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@v2.3.11
      - name: Build & Test
        timeout-minutes: 30
        run: |
          bun run ci
